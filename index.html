<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Les Petits Plats - Recettes rapides, simples et savoureuses</title>
  <meta name="description" content="Recherchez parmi plus de 1500 recettes simples et rapides à préparer. Découvrez des idées cuisine pour tous les jours avec Les Petits Plats.">
  <meta name="keywords" content="">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">

</head>

<body>
  <!-- Header section -->
  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center">
        <img src="assets/img/Logo.svg" alt="logo les petits plats">
      </a>
    </div>
  </header>

  <main class="main">
    <!-- Hero section -->
    <section id="hero" class="hero section">
      <img src="assets/img/hero-bg.jpg" alt="" class="">
      <div class="container text-center">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <h1>cherchez parmi plus de 1500 recettes du quotidien, simples et délicieuses</h1>
            <!-- Recherche principale debut -->
            <div class="search-bar">
              <form class="search-form d-flex align-items-center" method="POST" action="#">
                <input type="text" id="searchInput" placeholder="Rechercher une recette, un ingrédient...">
                <button type="submit"><i class="bi bi-search"></i></button>
                <button type="button" id="clearSearch" class="d-none">×</button>
              </form>
            </div>
            <!-- recherche principale fin -->
          </div>
        </div>
      </div>
    </section>

    <!-- Conteneur pour 3 filtres (Ingrédients, Appareils et Ustensiles) -->
    <section id="filters" class="container my-4">
      <div class="d-flex gap-3 flex-wrap">
        <!-- Ingrédients -->
        <div class="dropdown">
          <button id="ingredients-button" class="btn btn-secondary">
            Ingrédients <i class="bi bi-chevron-down"></i>
          </button>
          <div id="ingredients-dropdown" class="dropdown-menu">
            <input type="text" id="ingredients-input" class="form-control mb-2" placeholder="Rechercher un ingrédient">
            <span class="tag-clear d-none">×</span> <!-- bouton X caché par défaut -->
            <ul id="ingredients-list" class="list-unstyled mb-0"></ul>
          </div>
        </div>

        <!-- Appareils -->
        <div class="dropdown">
          <button id="appliances-button" class="btn btn-secondary">
            Appareils <i class="bi bi-chevron-down"></i>
          </button>
          <div id="appliances-dropdown" class="dropdown-menu">
            <input type="text" id="appliances-input" class="form-control mb-2" placeholder="Rechercher un appareil">
            <span class="tag-clear d-none">×</span> <!-- bouton X caché par défaut -->
            <ul id="appliances-list" class="list-unstyled mb-0"></ul>
          </div>
        </div>

        <!-- Ustensiles -->
        <div class="dropdown">
          <button id="ustensils-button" class="btn btn-secondary">
            Ustensiles <i class="bi bi-chevron-down"></i>
          </button>
          <div id="ustensils-dropdown" class="dropdown-menu">
            <input type="text" id="ustensils-input" class="form-control mb-2" placeholder="Rechercher un ustensile">
            <span class="tag-clear d-none">×</span> <!-- bouton X caché par défaut -->
            <ul id="ustensils-list" class="list-unstyled mb-0"></ul>
          </div>
        </div>
      </div>

      <!-- Afficheage des tags -->
      <div id="selected-tags" class="mt-3 d-flex flex-wrap gap-2"></div>
    </section>

    <!-- Recipes -->
    <section id="recipes" class="container">
      <!-- Affichage du nombre de recettes (mis à jour en JS) -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="recipes-count">0 recette</h2>
      </div>
      <!-- Affichage des cards recettes injectées dynamiquement en JS. -->
      <div id="recipes-container" class="row g-3"></div>
    </section>

  </main>

  <!--  Chargement des données -->
  <script src="data/recipes.js"></script>
  <script type="module" src="scripts/index.js"></script>
</body>

</html>
